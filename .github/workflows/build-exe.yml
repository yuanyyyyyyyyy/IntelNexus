name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: python build_exe.py

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path dist\IntelNexus\* -DestinationPath dist\IntelNexus-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntelNexus-Windows
          path: dist/IntelNexus-Windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IntelNexus-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
