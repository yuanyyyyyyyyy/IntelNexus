[server]
# 关闭文件监视器：transformers 的视觉模块会触发满屏 torchvision 导入噪音，
# 且本地部署不需要 runOnSave 热重载（本就是 false）
fileWatcherType = "none"
runOnSave = false
# 开启 static/ 目录静态服务：[[theme.fontFaces]] 的自托管字体经此路由
# （/app/static/...）下发，关闭时字体文件 404、字体注册无效。
enableStaticServing = true

# Material Icons 连字字体（fonts.gstatic.com）在国内被墙，失败时折叠面板
# 图标显示为原始英文文本（keyboard_arrow_right）叠在中文标题上。
# minimal 工具栏顺带移除对本地部署无意义的 Deploy 按钮。
[client]
toolbarMode = "minimal"

# [theme] 说明（2026-08-27 Hermes "优雅人文" 风格）：
# 项目仅单一浅色主题，无主题切换；下方取值即全局唯一主题配置，
# 与 styles.py 注入的自定义 CSS 观感统一。
# 字体方案（自托管，勿改用在线字体——国内网络下 Google Fonts 不可达）：
#   标题 Playfair Display（衬线体）+ 正文 Inter（无衬线体）
#   + 中文 Noto Serif SC（宋体）+ 等宽 JetBrains Mono（代码/哈希）。
#   HarmonyOS Sans SC 保留作为中文备选。
#   fontFaces 的 url 是相对应用根的路径，静态目录经 /app/static/ 前缀路由，
#   故形如 "app/static/fonts/..."；fontFaces 变更需重启服务器才生效。
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter/Inter-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter/Inter-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter/Inter-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter/Inter-Bold.woff2"
weight = 700

# --- Playfair Display（标题衬线体）---
[[theme.fontFaces]]
family = "Playfair Display"
url = "app/static/fonts/playfair-display/PlayfairDisplay-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Playfair Display"
url = "app/static/fonts/playfair-display/PlayfairDisplay-Bold.woff2"
weight = 700

# --- Noto Serif SC（中文宋体）---
[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-SemiBold.woff2"
weight = 600

[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-Bold.woff2"
weight = 700

[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-Latin-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "Noto Serif SC"
url = "app/static/fonts/noto-serif-sc/NotoSerifSC-Latin-Bold.woff2"
weight = 700

# --- HarmonyOS Sans SC（中文备选）---
[[theme.fontFaces]]
family = "HarmonyOS Sans SC"
url = "app/static/fonts/harmonyos/HarmonyOSSansSC-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "HarmonyOS Sans SC"
url = "app/static/fonts/harmonyos/HarmonyOSSansSC-Medium.woff2"
weight = 500

[[theme.fontFaces]]
family = "HarmonyOS Sans SC"
url = "app/static/fonts/harmonyos/HarmonyOSSansSC-Bold.woff2"
weight = 700

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono/JetBrainsMono-Regular.woff2"
weight = 400

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono/JetBrainsMono-Bold.woff2"
weight = 700

[theme]
base = "light"
primaryColor = "#1A1A1A"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A1A1A"
font = "Inter"
headingFont = "Playfair Display"
codeFont = "JetBrains Mono"

# 排版层级：正文 400；标题 h1=700、h2/h3=600、h4 起回落到 500。
baseFontWeight = 400
codeFontSize = "13px"
codeFontWeight = 400
headingFontSizes = ["2rem", "1.625rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 500, 500, 500]