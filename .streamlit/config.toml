[server]
# 关闭文件监视器：transformers 的视觉模块会触发满屏 torchvision 导入噪音，
# 且本地部署不需要 runOnSave 热重载（本就是 false）
fileWatcherType = "none"
runOnSave = false

# Material Icons 连字字体（fonts.gstatic.com）在国内被墙，失败时折叠面板
# 图标显示为原始英文文本（keyboard_arrow_right）叠在中文标题上。
# minimal 工具栏顺带移除对本地部署无意义的 Deploy 按钮。
[client]
toolbarMode = "minimal"

# [theme] 说明（2026-08-26 双主题改造后）：
# Streamlit 原生部件（按钮/输入框/下拉/expander）的色源在启动时静态确定，
# 不支持运行时切换；而自定义 CSS 主题（morandi / hermes-teal / nous-blue）
# 通过 styles.py 注入的 JS 按 data-theme 属性实时切换。
# 因此这里的值保持与「默认主题 morandi」一致，保证：
#   1) 未选主题时原生部件与自定义 CSS 观感统一；
#   2) 切到暗色 hermes-teal 后，原生部件仍为浅色——这是已知限制，
#      暗色适配的部件级覆盖见 styles.py 后续迭代。
# 若要全局换默认主题：改这里 + 改 sidebar._THEMES 默认项，两处同步。
[theme]
base = "light"
primaryColor = "#7B9CB5"
backgroundColor = "#E8E4DF"
secondaryBackgroundColor = "#F5F2EE"
textColor = "#5C5C5C"