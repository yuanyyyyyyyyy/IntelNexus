# IntelNexus 反向代理配置
# 域名占位符 __DOMAIN__：部署时用真实域名替换（见 DEPLOY.md 的 certbot 步骤）。
# 证书由 certbot 生成于宿主机 ./certs/live/__DOMAIN__/，挂载到 /etc/letsencrypt。

# ===== 80：仅用于 Let's Encrypt HTTP-01 验证 + 全量重定向到 HTTPS =====
server {
    listen 80;
    server_name __DOMAIN__;

    # certbot webroot 挑战目录（compose 已挂载 ./certs/webroot -> /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== 443：TLS 终止 + basic auth + 反代到应用容器 =====
server {
    listen 443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # basic auth：Streamlit 无原生登录，这是公网最小可行安全闸门。
    # 账号文件 ./nginx/htpasswd 由 `htpasswd -c ./nginx/htpasswd <user>` 生成。
    auth_basic           "IntelNexus Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;

    # 反代设置：支持 Streamlit 的 WebSocket（长连接 / 重连）
    location / {
        proxy_pass http://app:8501;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket 升级（Streamlit  hottest reload / script 重连依赖）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 健康检查端点透传（运维可用带凭据的 curl 探测）
    location = /_stcore/health {
        proxy_pass http://app:8501/_stcore/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
