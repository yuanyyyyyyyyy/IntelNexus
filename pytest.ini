[pytest]
# 测试套件唯一在 tests/ 下。未配置 testpaths 时 pytest 会从仓库根递归收集，
# 把 temp/（本地 460MB 工作区，含 pwlibs 等第三方源码树）里的 test_*.py 也收进来，
# 导致 collection error 无法跑测试。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 大目录与生成物一律不递归（.venv 已被 VirtualEnv 探测跳过，此处兜底）
norecursedirs =
    .git
    .venv
    venv
    env
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    dist
    build
    data
    temp
    docs
    experiments
    backup
    paperA
    tools
    node_modules
    *.egg
    .hermes
    .workbuddy
    .workbuddy-ai
